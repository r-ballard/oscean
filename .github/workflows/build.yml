name: Verify upstream build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git gawk python3
      - name: Test build guards
        run: bash scripts/test-build-guards.sh
      - name: Build with pinned tools
        run: bash scripts/build.sh
      - name: Check generated HTML and RSS
        run: python3 scripts/check-output.py
